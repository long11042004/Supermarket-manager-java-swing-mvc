spring.application.name=demo

spring.datasource.url=jdbc:h2:file:./data/productdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.check-template-location=true

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

app.mail.enabled=true
app.mail.from=supermarket@test.com

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hailongdao1010@gmail.com
spring.mail.password=dnxczhahcuhkmine
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.jwt.secret=change-this-secret-key-to-at-least-32-characters
app.jwt.expiration-ms=86400000

app.jms.enabled=true
app.jms.queue.email-notification=email.notification.queue
spring.activemq.broker-url=vm://embedded?broker.persistent=false&broker.useShutdownHook=false
spring.activemq.packages.trust-all=true

app.scheduling.enabled=true
app.scheduling.zone=Asia/Ho_Chi_Minh
app.scheduling.low-stock-threshold=10
app.scheduling.expiring-days-ahead=7
app.scheduling.inventory-check.fixed-delay-ms=1800000
app.scheduling.inventory-check.initial-delay-ms=15000
app.scheduling.daily-summary.cron=0 0 8 * * *
app.scheduling.daily-summary.recipient=
app.scheduling.special-notice.cron=0 */10 * * * *
app.scheduling.special-notice.promo-message=Special promotion: Get 10% off orders of 300,000 VND or more today!
app.scheduling.profile-reminder.cron=0 */5 * * * *
app.scheduling.profile-reminder.template=Your profile is incomplete: %s. Please update it on the profile page.
app.scheduling.profile-reminder.max-missing-fields=3
