<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Đơn hàng đã hủy</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #1f2937; margin: 0; padding: 24px; background-color: #f9fafb;">
    <div style="max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; border: 1px solid #e5e7eb;">
        <h2 style="color: #b91c1c; margin-top: 0;">Thông báo hủy đơn hàng</h2>
        <p>Xin chào <strong th:text="${recipientName}">Khách hàng</strong>,</p>
        <p>Đơn hàng #<span th:text="${order.id}">0</span> của bạn đã được hủy thành công.</p>
        <p><strong>Trạng thái hiện tại:</strong> <span th:text="${order.status}">CANCELLED</span></p>
        <p>Nếu cần hỗ trợ, vui lòng liên hệ bộ phận chăm sóc khách hàng.</p>
    </div>
</body>
</html>
