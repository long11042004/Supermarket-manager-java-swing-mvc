<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Ưu đãi mới</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #1f2937; margin: 0; padding: 24px; background-color: #f9fafb;">
    <div style="max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; border: 1px solid #e5e7eb;">
        <h2 style="color: #065f46; margin-top: 0;">Ưu đãi mới dành cho bạn</h2>
        <p>Xin chào <strong th:text="${recipientName}">Khách hàng</strong>,</p>
        <p>Chương trình <strong th:text="${promotion.name}">Ưu đãi</strong> vừa được công bố.</p>
        <p><strong>Mức ưu đãi:</strong> <span th:text="${discountDescription}">10%</span></p>
        <p th:if="${promotion.code != null and !#strings.isEmpty(promotion.code)}">
            <strong>Mã ưu đãi:</strong>
            <span th:text="${promotion.code}">SAVE10</span>
        </p>
        <p th:if="${promotion.minimumOrderAmount != null and promotion.minimumOrderAmount.signum() > 0}">
            <strong>Đơn hàng tối thiểu:</strong>
            <span th:text="${minimumOrder}">0</span> ₫
        </p>
        <p>
            <strong>Thời gian:</strong>
            <span th:text="${startsAt}">Ngày bắt đầu</span>
            –
            <span th:text="${endsAt}">Ngày kết thúc</span>
        </p>
        <p>Bạn có thể thay đổi hoặc hủy nhận email khuyến mãi trong phần hồ sơ tài khoản.</p>
    </div>
</body>
</html>
