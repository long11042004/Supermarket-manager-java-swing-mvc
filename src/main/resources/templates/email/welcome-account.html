<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Chào mừng tài khoản mới</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #1f2937; margin: 0; padding: 24px; background-color: #f9fafb;">
    <div style="max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; border: 1px solid #e5e7eb;">
        <h2 style="color: #065f46; margin-top: 0;">Chào mừng bạn đến với hệ thống</h2>
        <p>Xin chào <strong th:text="${recipientName}">Người dùng</strong>,</p>
        <p>Tài khoản của bạn đã được tạo thành công.</p>
        <p><strong>Tên đăng nhập:</strong> <span th:text="${username}">username</span></p>
        <p>Chúc bạn có trải nghiệm mua sắm thuận tiện và an toàn.</p>
    </div>
</body>
</html>
