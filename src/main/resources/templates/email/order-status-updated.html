<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Cập nhật đơn hàng</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #1f2937; margin: 0; padding: 24px; background-color: #f9fafb;">
    <div style="max-width: 640px; margin: 0 auto; background: #ffffff; border-radius: 12px; padding: 32px; border: 1px solid #e5e7eb;">
        <h2 style="color: #111827; margin-top: 0;">Đơn hàng được cập nhật</h2>
        <p>Xin chào <strong th:text="${recipientName}">Khách hàng</strong>,</p>
        <p>Trạng thái đơn hàng <strong>#<span th:text="${order.id}">0</span></strong> vừa được cập nhật:</p>
        <p>
            <strong th:switch="${order.status}">
                <span th:case="'CONFIRMED'">Đã xác nhận</span>
                <span th:case="'DELIVERING'">Đang giao hàng</span>
                <span th:case="'COMPLETED'">Đã giao thành công</span>
                <span th:case="*" th:text="${order.status}">Trạng thái</span>
            </strong>
        </p>
        <p th:if="${order.deliveryAddress != null}">
            <strong>Địa chỉ giao hàng:</strong>
            <span th:text="${order.deliveryAddress}">-</span>
        </p>
        <p>Cảm ơn bạn đã mua sắm tại cửa hàng của chúng tôi.</p>
    </div>
</body>
</html>
