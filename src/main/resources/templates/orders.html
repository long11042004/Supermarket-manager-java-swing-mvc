<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đơn hàng của tôi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(180deg, #f8fafc 0%, #fefce8 100%);
      font-family: "Segoe UI", sans-serif;
    }
    .shell {
      max-width: 1180px;
      margin: 0 auto;
      padding: 2rem 1rem 3rem;
    }
    .topbar,
    .order-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      padding: 1.3rem 1.5rem;
      box-shadow: 0 18px 48px rgba(15, 23, 42, 0.08);
    }
    .order-card {
      margin-top: 1.25rem;
    }
    .status-pill {
      display: inline-flex;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <div class="text-uppercase small text-warning-emphasis fw-bold">Mua trực tuyến</div>
        <h1 class="mb-0">Đơn hàng của tôi</h1>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a th:href="@{/products}" class="btn btn-primary">Tiếp tục mua</a>
        <a th:href="@{/profile}" class="btn btn-outline-dark">Tài khoản</a>
      </div>
    </div>

    <div th:if="${#lists.isEmpty(orders)}" class="order-card text-muted">
      Bạn chưa có đơn hàng nào. Hãy thêm sản phẩm vào giỏ để bắt đầu.
    </div>

    <div th:each="order : ${orders}" class="order-card">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-3">
        <div>
          <h4 class="mb-1" th:text="'Đơn hàng #' + ${order.id}">Đơn hàng #1</h4>
          <div class="text-muted" th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}">18/08/2026 10:00</div>
        </div>
        <div class="text-end">
          <div><span class="status-pill" th:text="${order.status}">PENDING</span></div>
          <strong th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</strong>
        </div>
      </div>

      <div class="mb-3">
        <div><strong>Giao đến:</strong> <span th:text="${order.deliveryAddress}">Địa chỉ</span></div>
        <div><strong>Liên hệ:</strong> <span th:text="${order.contactPhone != null and !#strings.isEmpty(order.contactPhone) ? order.contactPhone : 'Không có'}">Không có</span></div>
        <div><strong>Ghi chú:</strong> <span th:text="${order.note != null and !#strings.isEmpty(order.note) ? order.note : 'Không có'}">Không có</span></div>
      </div>

      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th>Sản phẩm</th>
              <th>Đơn giá</th>
              <th>Số lượng</th>
              <th>Thành tiền</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="item : ${order.items}">
              <td th:text="${item.product.name}">Tên sản phẩm</td>
              <td th:text="${#numbers.formatDecimal(item.unitPrice, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
              <td th:text="${item.quantity}">1</td>
              <td th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
