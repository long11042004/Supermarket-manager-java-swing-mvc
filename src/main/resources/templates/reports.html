<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Báo cáo thống kê</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/reports.css}" />
</head>
<body>
  <div class="container py-4">
    <div class="report-topbar d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <div class="text-uppercase small fw-bold text-success-emphasis">Quản trị</div>
        <h1 class="mb-0">Báo cáo thống kê</h1>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary">Dashboard</a>
        <a th:href="@{/products}" class="btn btn-outline-primary">Sản phẩm</a>
      </div>
    </div>

    <div class="filter-card mt-4">
      <form method="get" th:action="@{/reports}" class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label">Từ ngày</label>
          <input type="date" class="form-control" name="fromDate" th:value="${fromDate}" />
        </div>
        <div class="col-md-4">
          <label class="form-label">Đến ngày</label>
          <input type="date" class="form-control" name="toDate" th:value="${toDate}" />
        </div>
        <div class="col-md-2">
          <label class="form-label">Trạng thái</label>
          <select class="form-select" name="status">
            <option value="" th:selected="${status == ''}">Tất cả</option>
            <option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${status == item.name()}">PENDING</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-success">Xem báo cáo</button>
        </div>
      </form>
    </div>

    <div class="row g-4 mt-1">
      <div class="col-md-3">
        <div class="stat-card">
          <div class="text-muted">Tổng đơn</div>
          <div class="stat-value" th:text="${report.totalOrders}">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="text-muted">Doanh thu</div>
          <div class="stat-value" th:text="${#numbers.formatDecimal(report.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="text-muted">Giá trị TB/đơn</div>
          <div class="stat-value" th:text="${#numbers.formatDecimal(report.averageOrderValue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="text-muted">Guest / Thành viên</div>
          <div class="stat-value" th:text="${report.guestOrders} + ' / ' + ${report.memberOrders}">0 / 0</div>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-1">
      <div class="col-lg-5">
        <div class="section-card">
          <h4 class="mb-3">Đơn hàng theo trạng thái</h4>
          <div th:if="${#lists.isEmpty(report.statusStats)}" class="text-muted">Chưa có dữ liệu.</div>
          <div th:unless="${#lists.isEmpty(report.statusStats)}" class="table-responsive">
            <table class="table table-sm align-middle mb-0">
              <thead>
                <tr>
                  <th>Trạng thái</th>
                  <th>Số lượng</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item : ${report.statusStats}">
                  <td><span class="status-pill" th:text="${item.status}">PENDING</span></td>
                  <td th:text="${item.total}">0</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="section-card">
          <h4 class="mb-3">Top 5 sản phẩm bán chạy</h4>
          <div th:if="${#lists.isEmpty(report.topProducts)}" class="text-muted">Chưa có dữ liệu.</div>
          <div th:unless="${#lists.isEmpty(report.topProducts)}" class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Sản phẩm</th>
                  <th>Số lượng bán</th>
                  <th>Doanh thu</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item : ${report.topProducts}">
                  <td th:text="${item.productName}">Tên sản phẩm</td>
                  <td th:text="${item.totalQuantity + (#strings.isEmpty(item.unit) ? '' : ' ' + item.unit)}">0</td>
                  <td th:text="${#numbers.formatDecimal(item.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
