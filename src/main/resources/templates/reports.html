<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{reports.title}">Báo cáo thống kê</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/reports.css}" />
</head>
<body>
  <div class="container py-4">
    <div class="report-topbar d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <div class="text-uppercase small fw-bold text-success-emphasis" th:text="#{reports.admin}">Quản trị</div>
        <h1 class="mb-0" th:text="#{reports.title}">Báo cáo thống kê</h1>
      </div>
      <div class="d-flex gap-2 flex-wrap">
        <a th:href="@{/dashboard}" class="btn btn-outline-secondary" th:text="#{common.dashboard}">Dashboard</a>
        <a th:href="@{/products}" class="btn btn-outline-primary" th:text="#{common.products}">Sản phẩm</a>
        <form method="get" th:action="@{/reports}" class="d-inline-flex align-items-center gap-2">
          <label class="visually-hidden" for="reports-language-select" th:text="#{app.language}">Language</label>
          <select id="reports-language-select" class="form-select form-select-sm" name="lang" onchange="this.form.submit()">
            <option value="vi" th:selected="${#locale.language == 'vi'}" th:text="#{common.language.vi}">Tiếng Việt</option>
            <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{common.language.en}">English</option>
          </select>
        </form>
      </div>
    </div>

    <div class="filter-card mt-4">
      <form method="get" th:action="@{/reports}" class="row g-3 align-items-end">
        <div class="col-md-4">
          <label class="form-label" th:text="#{common.date.from}">Từ ngày</label>
          <input type="date" class="form-control" name="fromDate" th:value="${fromDate}" />
        </div>
        <div class="col-md-4">
          <label class="form-label" th:text="#{common.date.to}">Đến ngày</label>
          <input type="date" class="form-control" name="toDate" th:value="${toDate}" />
        </div>
        <div class="col-md-2">
          <label class="form-label" th:text="#{common.status}">Trạng thái</label>
          <select class="form-select" name="status">
            <option value="" th:selected="${status == ''}" th:text="#{reports.allStatuses}">Tất cả</option>
            <option th:each="item : ${statuses}" th:value="${item}" th:text="#{orderStatus.__${item.name()}__}" th:selected="${status == item.name()}">PENDING</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-success" th:text="#{common.viewReport}">Xem báo cáo</button>
        </div>
      </form>
    </div>

    <div class="row g-4 mt-1">
      <div class="col-md-3">
        <div class="stat-card">
          <div class="text-muted" th:text="#{reports.totalOrders}">Tổng đơn</div>
          <div class="stat-value" th:text="${report.totalOrders}">0</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="text-muted" th:text="#{common.revenue}">Doanh thu</div>
          <div class="stat-value" th:text="${#numbers.formatDecimal(report.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="text-muted" th:text="#{reports.averageOrderValue}">Giá trị TB/đơn</div>
          <div class="stat-value" th:text="${#numbers.formatDecimal(report.averageOrderValue, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="stat-card">
          <div class="text-muted" th:text="#{reports.guestVsMember}">Guest / Thành viên</div>
          <div class="stat-value" th:text="${report.guestOrders} + ' / ' + ${report.memberOrders}">0 / 0</div>
        </div>
      </div>
    </div>

    <div class="row g-4 mt-1">
      <div class="col-lg-5">
        <div class="section-card">
          <h4 class="mb-3" th:text="#{reports.ordersByStatus}">Đơn hàng theo trạng thái</h4>
          <div th:if="${#lists.isEmpty(report.statusStats)}" class="text-muted" th:text="#{reports.noData}">Chưa có dữ liệu.</div>
          <div th:unless="${#lists.isEmpty(report.statusStats)}" class="table-responsive">
            <table class="table table-sm align-middle mb-0">
              <thead>
                <tr>
                  <th th:text="#{common.status}">Trạng thái</th>
                  <th th:text="#{common.quantity}">Số lượng</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item : ${report.statusStats}">
                  <td><span class="status-pill" th:text="#{orderStatus.__${item.status.name()}__}">PENDING</span></td>
                  <td th:text="${item.total != null ? item.total : 0}">0</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="section-card">
          <h4 class="mb-3" th:text="#{reports.topProducts}">Top 5 sản phẩm bán chạy</h4>
          <div th:if="${#lists.isEmpty(report.topProducts)}" class="text-muted" th:text="#{reports.noData}">Chưa có dữ liệu.</div>
          <div th:unless="${#lists.isEmpty(report.topProducts)}" class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th th:text="#{orders.product}">Sản phẩm</th>
                  <th th:text="#{reports.soldQuantity}">Số lượng bán</th>
                  <th th:text="#{common.revenue}">Doanh thu</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item : ${report.topProducts}">
                  <td th:text="${item.productName}">Tên sản phẩm</td>
                  <td th:text="${(item.totalQuantity != null ? item.totalQuantity : 0) + (#strings.isEmpty(item.unit) ? '' : ' ' + item.unit)}">0</td>
                  <td th:text="${#numbers.formatDecimal(item.totalRevenue != null ? item.totalRevenue : 0, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
