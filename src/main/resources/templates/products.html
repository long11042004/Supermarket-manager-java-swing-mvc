<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{app.title}">Quản lý sản phẩm</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/products.css}" />
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <p class="text-primary fw-bold mb-1 text-uppercase small" th:text="#{app.system}">Hệ thống siêu thị</p>
        <h1 class="mb-0" th:text="#{app.title}">Quản lý sản phẩm</h1>
      </div>
      <div class="d-flex align-items-center gap-2">
        <div class="date-badge">
          <span class="date-badge-label">Today</span>
          <strong th:text="${#temporals.format(#temporals.createNow(), 'dd/MM/yyyy')}">13/08/2026</strong>
        </div>
        <span class="badge bg-primary fs-6" th:text="#{app.total(${#lists.size(products)})}">Tổng: 0</span>

        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-secondary" th:if="${session.loggedInUser != null}" th:text="${session.loggedInUser.fullName}">Người dùng</span>
          <a th:href="@{/dashboard}" class="btn btn-outline-primary btn-sm">Dashboard</a>
          <form th:action="@{/logout}" method="post" class="d-inline">
            <button type="submit" class="btn btn-outline-secondary btn-sm">Đăng xuất</button>
          </form>
        </div>

        <form method="get" th:action="@{/products}" class="language-form" aria-label="Language selector">
          <label class="visually-hidden" for="language-select" th:text="#{app.language}">Language</label>
          <select id="language-select" class="form-select form-select-sm language-select" name="lang" onchange="this.form.submit()">
            <option value="vi" th:selected="${#locale.language == 'vi'}">Tiếng Việt</option>
            <option value="en" th:selected="${#locale.language == 'en'}">English</option>
          </select>
        </form>
      </div>
    </div>

    <div class="search-toolbar card mb-4">
      <form method="get" th:action="@{/products}" class="row g-2 align-items-center">
        <div class="col-md-5">
          <label class="form-label mb-1" for="keyword">Tìm kiếm</label>
          <input id="keyword" type="text" class="form-control" name="keyword" th:value="${keyword}" placeholder="Nhập tên sản phẩm..." />
        </div>
        <div class="col-md-4">
          <label class="form-label mb-1" for="categoryFilter">Danh mục</label>
          <select id="categoryFilter" class="form-select" name="category">
            <option value="">Tất cả</option>
            <option th:each="item : ${categories}"
                    th:value="${item}"
                    th:text="${item}"
                    th:selected="${item == category}">Danh mục</option>
          </select>
        </div>
        <div class="col-md-3 d-flex align-items-end gap-2">
          <button type="submit" class="btn btn-primary flex-fill">Tìm kiếm</button>
          <a th:href="@{/products}" class="btn btn-outline-secondary">Xóa lọc</a>
        </div>
      </form>
    </div>

    <div class="row g-4">
      <div class="col-lg-4">
        <div class="mb-3">
          <button th:if="${canManageProducts}"
                  type="button" id="show-product-form" class="btn btn-primary w-100 add-product-btn" th:classappend="${product.id != null} ? 'd-none' : ''">
            <span class="add-product-icon">＋</span>
            <span th:text="#{app.addProduct}">Thêm sản phẩm</span>
          </button>
        </div>

        <div th:if="${canManageProducts}"
             id="product-form-card"
             class="card p-4"
             th:classappend="${product.id != null} ? '' : 'form-hidden'"
             th:attr="data-editing=${product.id != null}">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="mb-0" th:text="${product.id != null} ? #{app.updateProduct} : #{app.addProduct}">Thêm sản phẩm</h3>
            <button type="button" id="hide-product-form" class="btn btn-sm btn-outline-secondary" th:classappend="${product.id != null} ? 'd-none' : ''">Đóng</button>
          </div>

          <form th:action="${product.id != null} ? @{/products/{id}/update(id=${product.id})} : @{/products}" method="post" th:object="${product}">
            <div class="mb-3">
              <label class="form-label" th:text="#{app.name}">Tên sản phẩm</label>
              <input type="text" class="form-control" th:field="*{name}" required />
            </div>

            <div class="mb-3">
              <label class="form-label" th:text="#{app.category}">Danh mục</label>
              <input type="text" class="form-control" th:field="*{category}" required />
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" th:text="#{app.price}">Giá</label>
                <input type="number" min="0" step="1000" class="form-control" th:field="*{price}" required />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label" th:text="#{app.quantity}">Số lượng</label>
                <input type="number" min="0" class="form-control" th:field="*{quantity}" required />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label" th:text="#{app.unit}">Đơn vị</label>
              <input type="text" class="form-control" th:field="*{unit}" />
            </div>

            <div class="mb-3">
              <label class="form-label" th:text="#{app.expiryDate}">Hạn sử dụng</label>
              <input type="date" class="form-control" th:field="*{expiryDate}" />
            </div>

            <div class="d-flex gap-2">
              <button type="submit"
                      class="btn btn-primary flex-fill"
                      th:text="${product.id != null} ? #{app.update} : #{app.save}"
                      th:attr="data-saving-message=#{app.saving}">Lưu</button>
              <a th:if="${product.id != null}" th:href="@{/products}" class="btn btn-outline-secondary" th:text="#{app.cancel}">Hủy</a>
            </div>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="card p-3">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr>
                  <th>#</th>
                  <th th:text="#{app.name}">Tên</th>
                  <th th:text="#{app.category}">Danh mục</th>
                  <th th:text="#{app.price}">Giá</th>
                  <th th:text="#{app.quantity}">Số lượng</th>
                  <th th:text="#{app.unit}">Đơn vị</th>
                  <th th:text="#{app.expiryDate}">Hạn sử dụng</th>
                  <th th:text="#{app.edit}">Thao tác</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item, state : ${products}">
                  <td th:text="${state.count}">1</td>
                  <td>
                    <div class="fw-semibold" th:text="${item.name}">Tên</div>
                  </td>
                  <td th:text="${item.category}">Danh mục</td>
                  <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">0 ₫</td>
                  <td>
                    <span class="badge" th:classappend="${item.quantity <= 10} ? 'badge-low' : 'badge-good'"
                          th:text="${item.quantity}">0</span>
                  </td>
                  <td th:text="${item.unit != null ? item.unit : '—'}">—</td>
                  <td th:text="${item.expiryDate != null ? #temporals.format(item.expiryDate, 'dd/MM/yyyy') : '—'}">—</td>
                  <td>
                    <a th:if="${canManageProducts}" class="btn btn-sm btn-outline-primary me-1" th:href="@{/products/{id}/edit(id=${item.id})}" th:text="#{app.edit}">Sửa</a>
                    <form th:if="${canManageProducts}" th:action="@{/products/{id}/delete(id=${item.id})}" method="post" style="display:inline;">
                      <button type="submit"
                              class="btn btn-sm btn-outline-danger"
                              th:attr="data-confirm-message=#{app.confirmDelete}"
                              th:text="#{app.delete}">Xóa</button>
                    </form>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:src="@{/js/products.js}"></script>
</body>
</html>
