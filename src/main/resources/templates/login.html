<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="#{login.title}">Đăng nhập Cửa hàng</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-topbar">
      <form method="get" th:action="@{/login}" class="language-switcher d-inline-flex align-items-center gap-2">
        <label class="visually-hidden" for="login-language-select" th:text="#{app.language}">Language</label>
        <select id="login-language-select" class="form-select form-select-sm" name="lang" onchange="this.form.submit()">
          <option value="vi" th:selected="${#locale.language == 'vi'}" th:text="#{common.language.vi}">Tiếng Việt</option>
          <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{common.language.en}">English</option>
        </select>
      </form>
    </div>
    <div class="auth-shell">
      <div class="login-card">

      <div th:if="${specialNoticeMessage}" class="alert" role="alert"
           th:classappend="${specialNoticeLevel == 'warning'} ? ' alert-warning' : (${specialNoticeLevel == 'success'} ? ' alert-success' : ' alert-info')">
        <strong th:text="#{app.notice}">Thông báo</strong>
        <span th:text="${specialNoticeMessage}">Thong bao</span>
      </div>

      <div class="text-center mb-4">
        <div class="brand" th:text="#{app.system}">Cửa hàng ABC</div>
        <h2 class="auth-heading mt-2 mb-0">
          <span th:replace="~{fragments/common :: loginIcon}"></span>
          <span th:text="#{login.heading}">Đăng nhập</span>
        </h2>
      </div>

      <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">
        Đăng ký thành công
      </div>
      <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
        Sai tài khoản hoặc mật khẩu
      </div>

      <form th:action="@{/login}" method="post" th:object="${loginUser}">
        <div class="mb-3">
          <label class="form-label" for="login-username" th:text="#{common.username}">Tên đăng nhập</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text">
              <span th:replace="~{fragments/common :: userIcon}"></span>
            </span>
            <input id="login-username" type="text" class="form-control" th:field="*{username}" th:placeholder="#{login.usernamePlaceholder}" autocomplete="username" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="login-password" th:text="#{common.password}">Mật khẩu</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text">
              <span th:replace="~{fragments/common :: lockIcon}"></span>
            </span>
            <input id="login-password" type="password" class="form-control" th:field="*{password}" th:placeholder="#{login.passwordPlaceholder}" autocomplete="current-password" required />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100 d-inline-flex align-items-center justify-content-center gap-2" th:attr="data-loading-message=#{login.loginLoading}">
          <span th:replace="~{fragments/common :: loginIcon}"></span>
          <span th:text="#{login.loginButton}">Đăng nhập</span>
        </button>
      </form>

      <div class="mt-3">
        <a th:href="@{/products}" class="btn btn-outline-secondary w-100 d-inline-flex align-items-center justify-content-center gap-2">
          <span th:replace="~{fragments/common :: shopIcon}"></span>
          <span th:text="#{app.guestOrderLink}">Mua sắm theo khách</span>
        </a>
      </div>
    </div>

      <div class="register-card">
      <div class="text-center mb-4">
        <div class="brand" th:text="#{login.registerBrand}">Đăng ký</div>
        <h2 class="auth-heading mt-2 mb-0">
          <span th:replace="~{fragments/common :: registerIcon}"></span>
          <span th:text="#{login.registerHeading}">Tạo tài khoản</span>
        </h2>
      </div>

      <form th:action="@{/register}" method="post" th:object="${registerUser}">
        <div class="mb-3">
          <label class="form-label" for="register-full-name" th:text="#{common.fullName}">Họ và tên</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text">
              <span th:replace="~{fragments/common :: userIcon}"></span>
            </span>
            <input id="register-full-name" type="text" class="form-control" th:field="*{fullName}" th:placeholder="#{login.fullNamePlaceholder}" autocomplete="name" />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="register-username" th:text="#{common.username}">Tên đăng nhập</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text">
              <span th:replace="~{fragments/common :: userIcon}"></span>
            </span>
            <input id="register-username" type="text" class="form-control" th:field="*{username}" th:placeholder="#{login.usernamePlaceholder}" autocomplete="username" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="register-email" th:text="#{common.email}">Email</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text">
              <span th:replace="~{fragments/common :: emailIcon}"></span>
            </span>
            <input id="register-email" type="email" class="form-control" th:field="*{email}" placeholder="name@example.com" autocomplete="email" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="register-password" th:text="#{common.password}">Mật khẩu</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text">
              <span th:replace="~{fragments/common :: lockIcon}"></span>
            </span>
            <input id="register-password" type="password" class="form-control" th:field="*{password}" th:placeholder="#{login.createPasswordPlaceholder}" autocomplete="new-password" required />
          </div>
        </div>
        <div class="form-check mb-3">
          <input id="register-promotion-emails" type="checkbox" class="form-check-input" th:field="*{promotionEmailsEnabled}" />
          <label for="register-promotion-emails" class="form-check-label" th:text="#{login.promotionEmailConsent}">
            Nhận email về khuyến mãi và ưu đãi
          </label>
        </div>
        <button type="submit" class="btn btn-dark w-100 d-inline-flex align-items-center justify-content-center gap-2">
          <span th:replace="~{fragments/common :: registerIcon}"></span>
          <span th:text="#{login.registerButton}">Đăng ký tài khoản</span>
        </button>
      </form>
      </div>
    </div>
  </div>

  <script th:src="@{/js/login.js}"></script>
</body>
</html>
