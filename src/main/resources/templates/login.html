<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập Siêu thị</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/login.css}" />
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand">Hệ thống siêu thị</div>
      <h2 class="mt-2 mb-0">Đăng nhập</h2>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
      Sai tài khoản hoặc mật khẩu
    </div>

    <form th:action="@{/login}" method="post" th:object="${loginUser}">
      <div class="mb-3">
        <label class="form-label">Tên đăng nhập</label>
        <input type="text" class="form-control" th:field="*{username}" placeholder="admin" required />
      </div>
      <div class="mb-3">
        <label class="form-label">Mật khẩu</label>
        <input type="password" class="form-control" th:field="*{password}" placeholder="******" required />
      </div>
      <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
    </form>

    <div class="mt-3">
      <a th:href="@{/products}" class="btn btn-outline-secondary w-100">Đặt hàng không cần tài khoản</a>
    </div>

    <div class="mt-3 text-center small text-muted">
      Tài khoản mẫu: admin / admin123<br/>
      manager / manager123<br/>
      staff / staff123
    </div>
  </div>

  <script th:src="@{/js/login.js}"></script>
</body>
</html>
