<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <svg th:fragment="dashboardIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
    <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
    <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
    <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/>
  </svg>

  <svg th:fragment="productsIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="m4 8 8-4 8 4v10l-8 4-8-4V8Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="m4.5 8.5 7.5 4 7.5-4M12 13v8" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>

  <svg th:fragment="ordersIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="M7 4h10a2 2 0 0 1 2 2v15H5V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M9 4V2h6v2M8.5 10h7M8.5 14h7M8.5 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <svg th:fragment="promotionsIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="m3.5 12 8.2-8.2h7.8v7.8L11.3 19.8 3.5 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="16" cy="8" r="1.2" fill="currentColor"/>
    <path d="m9 15 5-5M9.4 10.1h.1M13.4 14.1h.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <svg th:fragment="reportsIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="M4 20V11M10 20V5M16 20v-7M22 20H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <svg th:fragment="usersIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/>
    <path d="M3 20a6 6 0 0 1 12 0M16 5.2a3.2 3.2 0 0 1 0 6.2M18 14a5 5 0 0 1 3 4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <svg th:fragment="loginIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="M13 5h6a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6M3 12h12m-4-4 4 4-4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <svg th:fragment="logoutIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="M11 5H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h6m2-4 4-4-4-4m4 4H7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <svg th:fragment="backIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="m14.5 5-7 7 7 7M8 12h13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <svg th:fragment="editIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="m14 5 5 5M4 20l4.5-1 10.8-10.8a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <svg th:fragment="shopIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <path d="M4 9h16l-1.3 11H5.3L4 9Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M8 9V7a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <svg th:fragment="searchIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/>
    <path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <svg th:fragment="filterIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="16" height="16">
    <path d="M4 6h16M7 12h10m-7 6h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <svg th:fragment="clearIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="17" height="17">
    <path d="m7 7 10 10M17 7 7 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/>
  </svg>

  <svg th:fragment="userIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
    <path d="M4.5 20a7.5 7.5 0 0 1 15 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <svg th:fragment="lockIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <rect x="4" y="10" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.8"/>
    <path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <svg th:fragment="emailIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
    <path d="m4 7 8 6 8-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <svg th:fragment="registerIcon" aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" width="18" height="18">
    <circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="1.8"/>
    <path d="M2.5 20a6.5 6.5 0 0 1 13 0m4-10v7m-3.5-3.5h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>

  <a th:fragment="accountLink(user)"
     th:href="@{/profile}"
     class="account-link"
     th:title="${user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName : user.username}">
    <img th:if="${user.avatarUrl != null and !#strings.isEmpty(user.avatarUrl)}"
         class="account-avatar"
         th:src="${user.avatarUrl}"
         alt=""
         onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';" />
    <span class="account-avatar-fallback"
          th:style="${user.avatarUrl != null and !#strings.isEmpty(user.avatarUrl)} ? 'display:none' : null"
          aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="1.8"/>
        <path d="M4.5 20a7.5 7.5 0 0 1 15 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </span>
    <span class="account-name"
          th:text="${user.fullName != null and !#strings.isEmpty(user.fullName) ? user.fullName : user.username}">User name</span>
  </a>
</body>
</html>
